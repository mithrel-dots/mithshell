<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Island — reference (Material 3 motion)</title>
<!--
  REFERENCE DESIGN for the top-bar "island" (Mithshell).
  Plain HTML/CSS/JS, no framework. Three states:
    idle  – compact pill (340px)
    peek  – on hover: pill widens (500px), lifts toward viewer (translateY + scale),
            date fades in, a hardware panel drops down from BEHIND the pill,
            side circles slide outward horizontally (they never move vertically)
    open  – on click of the pill: island widens (640px), panel grows into a full dashboard
            (header row, hw info, workspaces, volume, notifications). Peek styling stays on.
  All values that matter are CSS custom properties in :root — treat them as the spec.
  Motion follows Material 3: see the M3 tokens in :root and the "motion phases" block.
  peek→open is a container transform; the pill stays fixed as its header.
  Anything under MOCK DATA is placeholder: wire it to real system sources.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* ---- colour tokens ---- */
  --bg:#0a1113;            /* desktop / page */
  --surface:#0d1a1b;       /* pill + dropdown panel */
  --surface-hover:#0f1e1f; /* pill hover tint */
  --card:#0f1f20;          /* section cards */
  --card-row:#172526;      /* notification rows */
  --card-row-hover:#1c2c2d;
  --border:#1d3a36;        /* pill/panel/circle border (rest) */
  --border-active:#255047; /* pill/panel border (peek/open) */
  --card-border:#172d2b;
  --track:#1a2b2c;         /* progress / slider track */
  --btn:#1a2b2c; --btn-hover:#22393a; --btn-row:#213334;
  --ws-empty:#152223;
  --accent:#5fe3a1; --accent-hover:#7cf0b6; --on-accent:#0a1113;
  --text:#e6eeee; --text-2:#a9b9b9; --muted:#8fa3a3; --faint:#6f8484;
  --icon:#c9d6d6; --dot:#8b9a9a;

  /* ---- geometry ---- */
  --pill-h:52px;
  --w-idle:340px; --w-peek:500px; --w-open:640px;
  --drop-inset:22px;       /* panel is this much narrower than pill on each side */
  --circle:52px; --gap:14px;

  /* ---- Material 3 motion tokens ---- */
  --m3-emphasized:cubic-bezier(.2,0,0,1);          /* CSS approximation of the M3 emphasized path */
  --m3-emphasized-decelerate:cubic-bezier(.05,.7,.1,1);
  --m3-emphasized-accelerate:cubic-bezier(.3,0,.8,.15);
  --m3-standard:cubic-bezier(.2,0,0,1);
  --m3-standard-accelerate:cubic-bezier(.3,0,1,1);
  --m3-short2:100ms; --m3-short3:150ms; --m3-short4:200ms;
  --m3-medium2:300ms; --m3-medium4:400ms; --m3-long2:500ms;

  /* ---- island motion ---- */
  --scale:1.1;             /* "comes toward viewer" */
  --lift:16px;             /* moves down on peek */
  /* how far the circles slide out so the scaled pill never overlaps them */
  --push:calc(var(--w-peek) * (var(--scale) - 1) / 2 + 6px);
  --push-open:calc(var(--w-open) * (var(--scale) - 1) / 2 + 6px);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"JetBrains Mono",ui-monospace,monospace;display:flex;justify-content:center;padding-top:30px}
button{font:inherit;color:inherit}

/* ============ motion phases ============
   Every transition reads these four variables. Each state sets them on .bar, and CSS uses the
   TARGET state's values, so enter and exit get different curves:
     rest / collapsing → emphasized-accelerate, short   (exit)
     peek              → emphasized, medium4            (enter; decelerate is too front-loaded
                                                          for the panel reveal and reads as a blink)
     open              → emphasized, long (container transform)
   Fades (opacity/colour) use standard easing, short, slightly delayed on enter. */
.bar{display:flex;align-items:flex-start;gap:var(--gap);
  --move-ease:var(--m3-emphasized-accelerate); --move-dur:var(--m3-short4);
  --fade-ease:var(--m3-standard-accelerate);   --fade-dur:var(--m3-short2); --fade-delay:0ms}
.bar.is-peek{
  --move-ease:var(--m3-emphasized);            --move-dur:var(--m3-medium4);
  --fade-ease:var(--m3-standard);              --fade-dur:var(--m3-short4); --fade-delay:var(--m3-short2)}
/* .is-peek is set from JS on pointerenter/leave of .island */
.bar.is-open{
  --move-ease:var(--m3-emphasized);            --move-dur:var(--m3-long2);
  --fade-ease:var(--m3-standard);              --fade-dur:var(--m3-short4); --fade-delay:var(--m3-short3)}
.bar.is-collapsing{
  --move-ease:var(--m3-emphasized-accelerate); --move-dur:var(--m3-short4);
  --fade-ease:var(--m3-standard-accelerate);   --fade-dur:var(--m3-short2); --fade-delay:0ms}
.circle{width:var(--circle);height:var(--circle);border-radius:50%;flex:none;
  border:1.5px solid var(--border);background:var(--surface);
  display:grid;place-items:center;font-size:22px;
  transition:transform var(--move-dur) var(--move-ease)}
.circle.avatar{border-width:2px;
  background:conic-gradient(from 200deg,#d4553a,#e98a5c,#2f6fb3,#e8e1d8,#c9492f,#d4553a)} /* placeholder for user avatar image */

.island{position:relative;width:var(--w-idle);transform-origin:50% calc(var(--pill-h) / 2);
  filter:drop-shadow(0 0 0 rgba(0,0,0,0));
  transition:width var(--move-dur) var(--move-ease),transform var(--move-dur) var(--move-ease),filter var(--move-dur) var(--move-ease)}
/* Hover target is the island only (not the circles or gaps). This invisible strip covers the
   gap left above the pill once it moves down, so the pointer at the top edge doesn't
   flicker between peek and idle. */
.island::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(var(--lift) + 4px);display:none}
.bar.is-peek .island::before,.bar.is-open .island::before{display:block}

/* ============ pill (header) ============ */
.pill{position:relative;z-index:2;width:100%;height:var(--pill-h);padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  background:var(--surface);border:1.5px solid var(--border);border-radius:calc(var(--pill-h) / 2);
  box-shadow:0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.03);
  transition:box-shadow var(--fade-dur) var(--fade-ease),border-color var(--fade-dur) var(--fade-ease),background-color .15s ease}
.pill:hover{background:var(--surface-hover)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.dots{display:flex;gap:6px;align-items:center}
.dots i{display:block;width:9px;height:9px;border-radius:3px;background:var(--dot)}
.dots i.on{width:26px;background:var(--accent)}

.clock{display:flex;align-items:center}
.time{color:var(--accent);font-size:18px;font-weight:600;letter-spacing:.5px}
/* staggered date: "Fri" top-left, one tall slash, "25 Sep" bottom-right */
.date{display:flex;align-items:stretch;height:22px;font-size:12px;line-height:1;font-weight:600;
  color:var(--text-2);letter-spacing:.3px;white-space:nowrap;overflow:hidden;
  max-width:0;margin-left:0;opacity:0;
  transition:max-width var(--move-dur) var(--move-ease),margin-left var(--move-dur) var(--move-ease),opacity var(--fade-dur) var(--fade-ease) var(--fade-delay)}
.date .d{align-self:flex-start}
.date .m{align-self:flex-end}
.date svg{flex:none;margin:0 2px}

.wave{display:flex;gap:3px;align-items:center;height:22px}
.wave b{display:block;width:2.5px;border-radius:2px;background:var(--accent);opacity:.85;
  animation:wave 1.1s ease-in-out infinite}
@keyframes wave{50%{transform:scaleY(.4)}}

/* ============ dropdown panel (slides out from behind pill) ============ */
.drop{position:absolute;z-index:1;top:calc(var(--pill-h) / 2);left:var(--drop-inset);right:var(--drop-inset);
  padding:calc(var(--pill-h) / 2 + 12px) 12px 12px;display:flex;flex-direction:column;
  background:var(--surface);border:1.5px solid var(--border);border-top:none;border-radius:0 0 22px 22px;
  opacity:0;transform:translateY(-10px);clip-path:inset(0 0 100% 0);pointer-events:none;
  transition:clip-path var(--move-dur) var(--move-ease),transform var(--move-dur) var(--move-ease),opacity var(--fade-dur) var(--fade-ease),
             border-color var(--fade-dur) var(--fade-ease),border-radius var(--fade-dur) var(--fade-ease)}

/* collapsible sections that only exist in the open dashboard */
.more{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;
  transition:grid-template-rows var(--move-dur) var(--move-ease),opacity var(--fade-dur) var(--fade-ease),visibility 0s linear var(--move-dur)}
.more>div{min-height:0;overflow:hidden}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:14px}
.label{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}

.head{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px 6px}
.actions{display:flex;gap:8px;align-items:center}

.hw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{padding:12px 14px;font-size:12px;display:flex;flex-direction:column;gap:10px}
.stat-top{display:flex;align-items:center;gap:14px}
.stat-sub{color:var(--muted)}
.stat-val{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--accent)}
.stat-val .sep{width:1px;height:14px;background:var(--border)}
.stat-val .alt{color:var(--text)}
.stat-val .of{color:var(--muted)}
.bar-track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.net{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:13px}
.net .sep{width:1px;height:20px;background:var(--border)}
.net-item{display:flex;align-items:center;gap:10px;color:var(--accent)}
.net-item.lbl{gap:14px;color:var(--text)}

.sections{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.ws-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 18px 18px 20px}
.ws-title{font-size:19px;font-weight:700;margin-top:8px}
.ws-grid{display:grid;grid-template-columns:repeat(5,40px);gap:8px}
.ws{width:40px;height:40px;border-radius:11px;border:1px solid transparent;padding:0;cursor:pointer;font-size:13px;
  background:var(--ws-empty);color:var(--faint);font-weight:500;transition:background-color .15s,color .15s}
.ws.busy{background:var(--btn);color:var(--text);font-weight:700}
.ws.active{background:var(--accent);color:var(--on-accent);font-weight:800}
.ws:hover{border-color:#2c4f49}
.ws.wrap{grid-column:2} /* second row is right-aligned (4 items) */

.vol{display:flex;align-items:center;gap:14px;padding:2px 8px 2px 2px}
.vol-val{width:52px;text-align:right;font-size:13px;font-weight:600;color:var(--icon)}
.range{-webkit-appearance:none;appearance:none;flex:1;height:6px;margin:0;border-radius:3px;cursor:pointer;
  background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--v,72%) 100% no-repeat,var(--track)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:24px;border-radius:6px;
  background:var(--text);border:4px solid var(--surface);box-shadow:0 0 0 1px #2c4f49}
.range::-moz-range-thumb{width:10px;height:16px;border-radius:6px;background:var(--text);
  border:4px solid var(--surface);box-shadow:0 0 0 1px #2c4f49}

.notes{padding:16px;display:flex;flex-direction:column;gap:12px}
.notes-head{display:flex;align-items:center;justify-content:space-between;padding-left:4px}
.count{min-width:40px;height:40px;padding:0 12px;border-radius:11px;display:grid;place-items:center;
  background:var(--accent);color:var(--on-accent);font-size:14px;font-weight:700}
.note{display:flex;align-items:flex-start;gap:14px;padding:12px 10px 12px 14px;border-radius:12px;
  background:var(--card-row);transition:background-color .15s}
.note:hover{background:var(--card-row-hover)}
.note-ico{width:28px;height:28px;border-radius:8px;background:var(--surface);color:var(--icon);
  display:grid;place-items:center;flex:none;margin-top:1px}
.note-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.note-app{font-size:14px;font-weight:700}
.note-when{font-size:11px;color:var(--muted);margin-left:10px}
.note-text{font-size:12px;line-height:1.5;color:var(--text-2);overflow-wrap:anywhere}
.empty{padding:28px 0 22px;text-align:center;font-size:13px;color:var(--muted)}

.btn{width:40px;height:40px;border-radius:11px;border:1px solid transparent;padding:0;flex:none;cursor:pointer;
  display:grid;place-items:center;background:var(--btn);color:var(--icon);
  transition:background-color .15s,color .15s}
.btn:hover{background:var(--btn-hover);color:var(--text)}
.btn.sm{width:36px;height:36px;background:var(--btn-row)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:#15282a;color:var(--accent-hover)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.btn:focus-visible,.ws:focus-visible,.range:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ STATE: peek (hover) — also applied while open ============ */
.bar.is-peek .island,.bar.is-open .island{width:var(--w-peek);transform:translateY(var(--lift)) scale(var(--scale))}
.bar.is-peek .pill,.bar.is-open .pill{border-color:var(--border-active);
  box-shadow:0 26px 50px rgba(0,0,0,.65),0 0 0 1px rgba(95,227,161,.08),inset 0 1px 0 rgba(255,255,255,.04)}
.bar.is-peek .date,.bar.is-open .date{max-width:220px;margin-left:18px;opacity:1}
.bar.is-peek .drop,.bar.is-open .drop{opacity:1;transform:none;pointer-events:auto;border-color:var(--border-active);
  clip-path:inset(0 0 0 0)}
/* The panel's shadow comes from a filter on the island. A box-shadow on the panel would need a
   negative clip inset, and then the reveal finishes early and looks like a blink. */
.bar.is-peek .island,.bar.is-open .island{filter:drop-shadow(0 24px 28px rgba(0,0,0,.55))}
.bar.is-peek .circle.left,.bar.is-open .circle.left{transform:translateX(calc(var(--push) * -1))}
.bar.is-peek .circle.right,.bar.is-open .circle.right{transform:translateX(var(--push))}

/* ============ STATE: open (click) ============ */
.bar.is-open .island{width:var(--w-open)}
.bar.is-open .circle.left{transform:translateX(calc(var(--push-open) * -1))}
.bar.is-open .circle.right{transform:translateX(var(--push-open))}
.bar.is-open .drop{border-radius:0 0 30px 30px}
.bar.is-open .more{grid-template-rows:1fr;opacity:1;visibility:visible;
  transition:grid-template-rows var(--move-dur) var(--move-ease),opacity var(--fade-dur) var(--fade-ease) var(--fade-delay),visibility 0s}

@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
</style>
</head>
<body>

<div class="bar" id="bar">
  <div class="circle left" aria-label="Workspace 5">5</div>

  <div class="island">
    <button class="pill" id="pill" type="button" aria-expanded="false" aria-controls="drop">
      <span class="dots" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i></span>
      <span class="clock">
        <span class="time" id="time">16:50</span>
        <span class="date" aria-hidden="true">
          <span class="d" id="date-day">Fri</span>
          <svg width="10" height="22" viewBox="0 0 10 22" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 21 8.5 1"/></svg>
          <span class="m" id="date-rest">25 Sep</span>
        </span>
      </span>
      <span class="wave" id="wave" aria-hidden="true"></span>
    </button>

    <div class="drop" id="drop">
      <!-- open only: header row -->
      <div class="more"><div>
        <div class="head">
          <div class="label">Mithshell // Local</div>
          <div class="actions">
            <button class="btn" type="button" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
            <button class="btn" type="button" aria-label="Search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg></button>
            <button class="btn" type="button" id="close" aria-label="Close dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
        </div>
      </div></div>

      <!-- peek + open: hardware -->
      <div class="hw">
        <div class="card stat">
          <div class="stat-top">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--icon)" stroke-width="1.5" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2.5v3.5M12 2.5v3.5M15 2.5v3.5M9 18v3.5M12 18v3.5M15 18v3.5M2.5 9h3.5M2.5 12h3.5M2.5 15h3.5M18 9h3.5M18 12h3.5M18 15h3.5"/></svg>
            <div><div class="stat-sub">CPU</div>
              <div class="stat-val"><span id="cpu">38%</span><span class="sep"></span><span class="alt" id="temp">61°C</span></div></div>
          </div>
          <div class="bar-track"><i id="cpu-bar" style="width:38%"></i></div>
        </div>
        <div class="card stat">
          <div class="stat-top">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h19v7h-1.5v3h-16v-3h-1.5z"/><path d="M7 10v2M10 10v2M14 10v2M17 10v2M8 17v-2M12 17v-2M16 17v-2"/></svg>
            <div><div class="stat-sub">RAM</div>
              <div class="stat-val"><span id="ram">9.4 GB</span><span class="of" id="ram-total">/ 32 GB</span></div></div>
          </div>
          <div class="bar-track"><i id="ram-bar" style="width:29%"></i></div>
        </div>
        <div class="card net">
          <div class="net-item lbl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--icon)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V4M3.5 7.5 7 4l3.5 3.5M17 4v16M13.5 16.5 17 20l3.5-3.5"/></svg>NET</div>
          <span class="sep"></span>
          <div class="net-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg><span id="down">12.4 MB/s</span></div>
          <span class="sep"></span>
          <div class="net-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/></svg><span id="up">1.8 MB/s</span></div>
        </div>
      </div>

      <!-- open only: dashboard sections -->
      <div class="more"><div><div class="sections">
        <div class="card ws-card">
          <div>
            <div class="label">DP-1 // Workspace <span id="ws-num">13</span></div>
            <div class="ws-title">Quiet desktop</div>
          </div>
          <div class="ws-grid" id="ws-grid" role="group" aria-label="Workspaces"></div>
        </div>

        <div class="vol">
          <button class="btn ghost" type="button" id="mute" aria-label="Mute"></button>
          <input class="range" id="vol" type="range" min="0" max="100" value="72" aria-label="Volume">
          <span class="vol-val" id="vol-val">72%</span>
        </div>

        <div class="card notes">
          <div class="notes-head">
            <div class="label">Notifications</div>
            <div class="actions">
              <button class="btn" type="button" id="clear" aria-label="Clear all notifications"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"/></svg></button>
              <button class="btn" type="button" id="dnd" aria-label="Do not disturb" aria-pressed="false"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A18 18 0 0 1 18 8M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M18 8a6 6 0 0 0-9.3-5M2 2l20 20"/></svg></button>
              <span class="count" id="count">4</span>
            </div>
          </div>
          <div id="note-list" style="display:flex;flex-direction:column;gap:12px"></div>
        </div>
      </div></div></div>
    </div>
  </div>

  <div class="circle avatar right" aria-label="User"></div>
</div>

<script>
/* ================= MOCK DATA — replace with real sources ================= */
const state = {
  open: false,
  ws: 13,
  occupied: [10, 11, 13],
  workspaces: [10, 11, 12, 13, 14, 15, 16, 17, 18],
  vol: 72, muted: false, dnd: false,
  notifs: [
    { id: 1, app: 'Satty', when: 'now', kind: 'clip', body: 'Copied to clipboard.' },
    { id: 2, app: 'Satty', when: '2m',  kind: 'file', body: "File saved to '/home/mithrel/Pictures/Screenshots/2026-09-25_16-34-52_orego.png'." },
    { id: 3, app: 'Satty', when: '2m',  kind: 'clip', body: 'Copied to clipboard.' },
    { id: 4, app: 'Satty', when: '3m',  kind: 'file', body: "File saved to '/home/mithrel/Pictures/Screenshots/2026-09-25_16-34-37_orego.png'." },
  ],
};
/* ======================================================================== */

const $ = (id) => document.getElementById(id);
const ICON = {
  file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  clip: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>',
  x: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  vol: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>',
  muted: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>',
};

/* audio wave (decorative, animated) */
[8, 12, 16, 10, 18, 14, 9, 20, 12, 7].forEach((h, i) => {
  const b = document.createElement('b');
  b.style.height = h + 'px';
  b.style.animationDelay = (i * 0.09).toFixed(2) + 's';
  $('wave').appendChild(b);
});

/* clock + staggered date (abbreviated: "Fri" / "25 Sep") */
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function tick() {
  const d = new Date();
  $('time').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  $('date-day').textContent = DAYS[d.getDay()];
  $('date-rest').textContent = d.getDate() + ' ' + MONTHS[d.getMonth()];
}
tick(); setInterval(tick, 10000);

/* open / close */
/* peek = pointer over the island itself (pill, its hover strip, or the dropped panel) */
const island = document.querySelector('.island');
island.addEventListener('pointerenter', () => $('bar').classList.add('is-peek'));
island.addEventListener('pointerleave', () => $('bar').classList.remove('is-peek'));

let collapseTimer;
function setOpen(v) {
  const bar = $('bar');
  state.open = v;
  clearTimeout(collapseTimer);
  // closing: use exit timing (emphasized-accelerate) even while the pointer still hovers
  bar.classList.toggle('is-collapsing', !v);
  if (!v) collapseTimer = setTimeout(() => bar.classList.remove('is-collapsing'), 250);
  bar.classList.toggle('is-open', v);
  $('pill').setAttribute('aria-expanded', String(v));
}
$('pill').addEventListener('click', () => setOpen(!state.open));
$('close').addEventListener('click', () => setOpen(false));

/* workspaces */
function renderWs() {
  $('ws-num').textContent = state.ws;
  $('ws-grid').innerHTML = '';
  state.workspaces.forEach((n, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ws' + (n === state.ws ? ' active' : state.occupied.includes(n) ? ' busy' : '') + (i === 5 ? ' wrap' : '');
    b.textContent = n;
    b.setAttribute('aria-label', 'Workspace ' + n);
    b.setAttribute('aria-pressed', String(n === state.ws));
    b.onclick = () => { state.ws = n; renderWs(); };
    $('ws-grid').appendChild(b);
  });
}

/* volume */
function renderVol() {
  const v = state.muted ? 0 : state.vol;
  $('vol').value = state.vol;
  $('vol').style.setProperty('--v', v + '%');
  $('vol-val').textContent = state.muted ? 'Muted' : state.vol + '%';
  $('mute').innerHTML = state.muted ? ICON.muted : ICON.vol;
  $('mute').setAttribute('aria-label', state.muted ? 'Unmute' : 'Mute');
}
$('vol').addEventListener('input', (e) => { state.vol = +e.target.value; state.muted = false; renderVol(); });
$('mute').addEventListener('click', () => { state.muted = !state.muted; renderVol(); });

/* notifications */
function renderNotes() {
  const list = $('note-list');
  list.innerHTML = '';
  $('count').textContent = state.notifs.length;
  if (!state.notifs.length) { list.innerHTML = '<div class="empty">All caught up</div>'; return; }
  state.notifs.forEach((n) => {
    const row = document.createElement('div');
    row.className = 'note';
    row.innerHTML =
      '<div class="note-ico">' + ICON[n.kind] + '</div>' +
      '<div class="note-body"><div><span class="note-app"></span><span class="note-when"></span></div><div class="note-text"></div></div>' +
      '<button class="btn sm" type="button" aria-label="Dismiss notification">' + ICON.x + '</button>';
    row.querySelector('.note-app').textContent = n.app;
    row.querySelector('.note-when').textContent = n.when;
    row.querySelector('.note-text').textContent = n.body;
    row.querySelector('button').onclick = () => { state.notifs = state.notifs.filter((x) => x.id !== n.id); renderNotes(); };
    list.appendChild(row);
  });
}
$('clear').addEventListener('click', () => { state.notifs = []; renderNotes(); });
$('dnd').addEventListener('click', () => { state.dnd = !state.dnd; $('dnd').setAttribute('aria-pressed', String(state.dnd)); });

renderWs(); renderVol(); renderNotes();
</script>
</body>
</html>
