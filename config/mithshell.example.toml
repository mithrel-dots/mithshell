[shell]
# Use ["*"] for every connected output, or list exact Hyprland output names.
monitors = ["*"]
top_margin = 6
exclusive_zone = 48
animation_ms = 280
# 0 selects an automatic scale from each monitor's logical width.
scale = 0

# Circle/launcher options below configure the optional production UI surfaces.
# See README's "Circle and launcher configuration".
[circles]
# Each side accepts "none", "tray", "media", or "notifications".
# A non-none module may appear on only one side. Empty circles are absent.
# Unassigned tray retains pill-hover access; media/notifications stay in the
# dashboard. Media assignment also removes the central playing-media view.
left = "none"
right = "none"

[launcher]
# "independent" keeps the separate launcher; "integrated" requests an
# island-replacing launcher that emerges from and merges back into the island.
presentation = "independent"

[media]
# Show audio bars in the main island even when media is assigned to a circle.
visualizer = true
# Maximum media-pill width as a multiple of the compact pill width.
max_width_factor = 1.8

[battery]
# Draw a moving divider behind the text, positioned by battery percentage.
wave = false
# Blend the level color into the active theme. Set false for the raw color.
tint = true
# "horizontal": fill bottom to top; "vertical": fill left to right.
# At 99% the divider is almost at the top/right edge; at 100% it disappears.
orientation = "horizontal"

[notifications]
# What to do when the focused monitor has a fullscreen window and the
# notification does not qualify for overlay rendering: "ignore" keeps it on
# the focused monitor, "fallback" picks one non-fullscreen monitor, and
# "all-non-fullscreen" shows it on every non-fullscreen monitor.
fullscreen_strategy = "fallback"
# Preferred connector order for "fallback". If none are usable, mithshell
# continues to any available non-fullscreen monitor in Hyprland monitor-id
# order. An empty list uses that automatic order immediately.
fallback_monitors = []
# Minimum urgency allowed to use the Wayland Overlay layer while its target
# monitor is fullscreen: "off", "low", "normal", or "critical".
overlay_over_fullscreen = "off"
# "pill" shows one notification at a time in place of the compact pill,
# exactly like the volume/brightness/workspace OSD. "below-pill" instead
# pops a small popup directly under the island. "top-left", "top-right",
# "bottom-left" and "bottom-right" anchor that same popup to a screen
# corner instead of following the island.
position = "pill"
# Fallback duration a notification stays visible for, honored when the
# sender does not request an explicit expiry.
timeout_ms = 5000
# Maximum simultaneously visible toasts. Only applies to "below-pill" and
# the corner positions; "pill" always shows one at a time and queues the
# rest.
max_visible = 5
# Notifications kept in history (dashboard, or circle when assigned).
# The circle count is retained history, including expired popups, not unread.
max_history = 50
# Latest retained entries requested for circle hover.
# Zero requests only a minimal header and access to the full history view.
hover_preview_count = 3
# Spacing between stacked toasts, and between the island and the popup in
# "below-pill" position.
gap = 8
# Distance from the screen edges for the corner positions.
margin = 12

[tray]
# When false, mithshell neither hosts nor watches for
# org.kde.StatusNotifierItem tray icons, and the pill never grows a tray
# section. Without a circle assignment, icons appear while hovering the pill.
enabled = true
# Compact circle presentation: "count" or "count-with-icons".
compact_style = "count"
# Maximum tiny preview icons in "count-with-icons" mode. Zero is count-only;
# neither the total count nor access to every expanded tray item is limited.
max_compact_icons = 4
# Expanded circle grows to its contents, up to this many visible icons.
# Scroll horizontally or use the mouse wheel to reach additional icons.
max_expanded_icons = 8

[icons]
# How mithshell's own controls are drawn.
#   "glyph"    - Nerd Font glyphs, independent of the GTK icon theme. Any
#                glyph the installed fonts cannot draw falls back to a themed
#                icon on its own, so this is safe without a patched font.
#   "symbolic" - always use themed icons from the GTK icon theme.
# Icons supplied by other programs (tray, notifications, MPRIS, TarraGon)
# always come from the icon theme either way.
style = "glyph"

[lock]
# PAM service the lock screen authenticates against. When unset, mithshell
# uses /etc/pam.d/mithshell if it exists and otherwise inherits
# /etc/pam.d/login, which already has the right stack for the console user.
# pam_service = "mithshell"

# The lock backdrop is a screenshot taken the instant before the lock
# appears, shrunk, box-blurred three times, and dimmed. blur_downscale is
# the strongest performance lever: cost falls with its square.
blur_radius = 6
blur_downscale = 6
# Brightness multiplier for the backdrop: 0 is black, 1 leaves it untouched.
dim = 0.55

[theme]
# "material" generates a Material You scheme from theme.source below.
# "gtk" instead inherits the active GTK theme's named colors
# (@accent_color, @window_bg_color, @borders, ...) and ignores
# mode/variant/source entirely.
engine = "material"
mode = "dark"
variant = "tonal-spot"

[theme.source]
kind = "color"
value = "#9aa7ff"

# To extract the Material You source color from a wallpaper instead:
# [theme.source]
# kind = "image"
# path = "/home/you/Pictures/wallpaper.jpg"

# A "colors.css" file placed next to this config.toml, if present, is
# loaded as a higher-priority stylesheet layered on top of whichever
# engine is active above. It can override individual @ms_* colors, or
# any other selector in the built-in stylesheet. See colors.example.css.
