# Start directly when mithshell is not managed by a systemd user service.
exec-once = mithshell daemon

# Dashboard controls. `focused` is resolved from Hyprland IPC by the daemon.
bind = SUPER, C, exec, mithshell toggle --monitor focused
bind = SUPER, SPACE, exec, mithshell search --monitor focused
bind = SUPER SHIFT, C, exec, mithshell close --monitor all

# Mithshell observes PipeWire changes and displays the volume OSD automatically.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# `brightnessctl` is optional; the dashboard itself reads standard backlight sysfs.
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && mithshell osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && mithshell osd brightness
