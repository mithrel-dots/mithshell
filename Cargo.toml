[package]
name = "mithshell"
version = "0.1.0"
edition = "2024"
description = "A small GTK4 dynamic island for Hyprland"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
log = "0.4"
material-colors = { version = "0.4.2", features = ["image", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
