[package]
name = "mithshell"
version = "0.1.0"
edition = "2024"
description = "A small GTK4 dynamic island for Hyprland"

[dependencies]
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = { version = "0.8", features = ["v1_3"] }
gtk4-session-lock = { version = "0.4.0", features = ["v1_1", "v1_2"] }
image = "0.25.10"
libc = "0.2.189"
log = "0.4"
material-colors = { version = "0.4.2", features = ["image", "serde"] }
notify = "8.2.0"
pam-sys = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.11"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = { package = "tree-sitter-md-025", version = "0.5.6" }
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
ureq = "3.3.0"
wait-timeout = "0.2.1"

[profile.release]
# A long-lived shell daemon benefits more from a small resident image than
# from aggressive inlining. LTO in particular lets the linker discard the
# unused parts of the bundled tree-sitter grammars and image decoders.
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
